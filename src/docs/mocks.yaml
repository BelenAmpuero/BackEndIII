paths:

  # ==========================================
  # GET MOCKING USERS
  # ==========================================

  /api/mocks/mockingusers:
    get:
      summary: Generar usuarios mock
      description: Genera una cantidad determinada de usuarios ficticios utilizando Faker.
      tags:
        - Mocks

      parameters:
        - name: qty
          in: query
          required: false
          description: Cantidad de usuarios mock a generar. Si no se especifica, se genera 1 usuario.
          schema:
            type: integer
            minimum: 1
            example: 5

      responses:

        "200":
          description: Usuarios mock generados correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMockResponse"

              example:
                status: success
                payload:
                  - _id: "64f1a2b3c4d5e6f789012345"
                    name: "Juan Pérez"
                    email: "juan.perez@example.com"
                    password: "$2b$10$examplehashedpassword"
                    role: "user"
                    phone: "+54 351 5551234"
                    address: "Av. Colón 1234"

        "400":
          description: La cantidad de mocks solicitada no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

              example:
                status: error
                code: INVALID_MOCK_QUANTITY
                message: "La cantidad de mocks solicitada no es válida"

        "500":
          description: Error al generar los datos de prueba
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

              example:
                status: error
                code: MOCK_GENERATION_ERROR
                message: "Error al generar los datos de prueba"


  # ==========================================
  # GET MOCKING ORDERS
  # ==========================================

  /api/mocks/mockingorders:
    get:
      summary: Generar pedidos mock
      description: Genera pedidos ficticios junto con usuarios mock asociados a cada pedido.
      tags:
        - Mocks

      parameters:
        - name: qty
          in: query
          required: false
          description: Cantidad de pedidos mock a generar. Si no se especifica, se generan 5 pedidos.
          schema:
            type: integer
            minimum: 1
            example: 5

      responses:

        "200":
          description: Pedidos mock generados correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderMockResponse"

              example:
                status: success
                payload:
                  - _id: "64f1a2b3c4d5e6f789012346"
                    user: "64f1a2b3c4d5e6f789012345"
                    items:
                      - product: "Wireless Mouse"
                        quantity: 2
                        price: 4500
                    total: 9000
                    deliveryAddress: "Av. Colón 1234"
                    status: "pending"
                    priority: "medium"

        "400":
          description: La cantidad de mocks solicitada no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

              example:
                status: error
                code: INVALID_MOCK_QUANTITY
                message: "La cantidad de mocks solicitada no es válida"

        "500":
          description: Error al generar los datos de prueba
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

              example:
                status: error
                code: MOCK_GENERATION_ERROR
                message: "Error al generar los datos de prueba"


  # ==========================================
  # POST GENERATED DATA
  # ==========================================

  /api/mocks/generatedata:
    post:
      summary: Generar e insertar datos de prueba
      description: Genera usuarios, pedidos, repartidores y entregas mock y los inserta en MongoDB.
      tags:
        - Mocks

      parameters:
        - name: qty
          in: query
          required: false
          description: Cantidad de usuarios, pedidos, repartidores y entregas a generar. Si no se especifica, se generan 10 registros de cada entidad.
          schema:
            type: integer
            minimum: 1
            example: 10

      responses:

        "201":
          description: Datos de prueba generados e insertados correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockGenerationResponse"

              example:
                status: success
                message: "Datos de prueba generados correctamente"
                inserted:
                  users: 10
                  orders: 10
                  deliveryPersons: 10
                  deliveries: 10

        "400":
          description: La cantidad de mocks solicitada no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

              example:
                status: error
                code: INVALID_MOCK_QUANTITY
                message: "La cantidad de mocks solicitada no es válida"

        "500":
          description: Error al guardar los datos de prueba
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

              examples:

                generationError:
                  summary: Error durante la generación
                  value:
                    status: error
                    code: MOCK_GENERATION_ERROR
                    message: "Error al generar los datos de prueba"

                databaseError:
                  summary: Error al guardar en la base de datos
                  value:
                    status: error
                    code: MOCK_DATABASE_ERROR
                    message: "Error al guardar los datos de prueba"