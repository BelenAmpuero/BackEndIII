# ==========================================
# DELIVERIES
# ==========================================

paths:

  # ----------------------------------------
  # GET ALL DELIVERIES
  # ----------------------------------------

  /api/deliveries:

    get:
      tags:
        - Deliveries

      summary: Obtener todas las entregas

      description: >
        Obtiene la lista de todas las entregas registradas en la base de datos.

      responses:

        "200":
          description: Lista de entregas obtenida correctamente
          content:
            application/json:
              schema:
                type: object
                properties:

                  status:
                    type: string
                    example: success

                  payload:
                    type: array
                    items:
                      $ref: "#/components/schemas/Delivery"

        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

              example:
                status: error
                code: INTERNAL_SERVER_ERROR
                message: "Error interno del servidor"


  # ----------------------------------------
  # GET DELIVERY BY ID
  # ----------------------------------------

  /api/deliveries/{id}:

    get:
      tags:
        - Deliveries

      summary: Obtener una entrega por ID

      description: >
        Obtiene una entrega específica utilizando su identificador único.

      parameters:

        - name: id
          in: path
          required: true
          description: Identificador único de la entrega
          schema:
            type: string
            example: "64f1a2b3c4d5e6f789012348"

      responses:

        "200":
          description: Entrega obtenida correctamente
          content:
            application/json:
              schema:
                type: object
                properties:

                  status:
                    type: string
                    example: success

                  payload:
                    $ref: "#/components/schemas/Delivery"

        "400":
          description: El estado o los datos de la entrega no son válidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

              example:
                status: error
                code: INVALID_DELIVERY_STATUS
                message: "El estado de la entrega no es válido"

        "404":
          description: Entrega no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

              example:
                status: error
                code: DELIVERY_NOT_FOUND
                message: "Entrega no encontrada"

        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

              example:
                status: error
                code: INTERNAL_SERVER_ERROR
                message: "Error interno del servidor"