paths:

  # ==========================================
  # LOGGER DEBUG
  # ==========================================

  /api/loggerTest/debug:
    get:
      summary: Probar nivel DEBUG del logger
      description: Genera un mensaje de prueba con nivel DEBUG para validar el funcionamiento del sistema de logging.
      tags:
        - Logger

      responses:

        "200":
          description: Log DEBUG generado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

              example:
                status: success
                message: "Log DEBUG generado correctamente"


