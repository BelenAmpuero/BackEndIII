# ==========================================
# USERS
# ==========================================

paths:

  # ----------------------------------------
  # GET ALL USERS / CREATE USER
  # ----------------------------------------

  /api/users:

    get:
      tags:
        - Users

      summary: Obtener todos los usuarios

      description: >
        Obtiene la lista de todos los usuarios registrados
        en la base de datos.

      responses:

        "200":
          description: Lista de usuarios obtenida correctamente
          content:
            application/json:
              schema:
                type: object
                properties:

                  status:
                    type: string
                    example: success

                  payload:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"

        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

              example:
                status: error
                code: INTERNAL_SERVER_ERROR
                message: "Error interno del servidor"


    # ----------------------------------------
    # CREATE USER
    # ----------------------------------------

    post:
      tags:
        - Users

      summary: Crear un nuevo usuario

      description: >
        Crea un nuevo usuario y almacena sus datos en la base de datos.
        La contraseña es hasheada antes de ser almacenada.

      requestBody:
        required: true

        content:
          application/json:

            schema:
              $ref: "#/components/schemas/CreateUser"

            example:
              name: "Juan Pérez"
              email: "juan.perez@example.com"
              password: "coder123"
              role: "user"
              phone: "+54 351 5551234"
              address: "Av. Colón 1234, Córdoba"

      responses:

        "201":
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:

                  status:
                    type: string
                    example: success

                  payload:
                    $ref: "#/components/schemas/User"

        "400":
          description: Los datos enviados no son válidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

              example:
                status: error
                code: INVALID_USER_DATA
                message: "Los datos del usuario no son válidos"

        "409":
          description: El usuario ya existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

              example:
                status: error
                code: USER_ALREADY_EXISTS
                message: "El usuario ya existe"

        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

              example:
                status: error
                code: INTERNAL_SERVER_ERROR
                message: "Error interno del servidor"


  # ----------------------------------------
  # GET USER BY ID
  # ----------------------------------------

  /api/users/{id}:

    get:
      tags:
        - Users

      summary: Obtener un usuario por ID

      description: >
        Obtiene un usuario específico utilizando su
        identificador único.

      parameters:

        - name: id
          in: path
          required: true
          description: Identificador único del usuario

          schema:
            type: string
            example: "64f1a2b3c4d5e6f789012345"

      responses:

        "200":
          description: Usuario obtenido correctamente
          content:
            application/json:
              schema:
                type: object
                properties:

                  status:
                    type: string
                    example: success

                  payload:
                    $ref: "#/components/schemas/User"

        "400":
          description: El ID proporcionado no es válido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

              example:
                status: error
                code: INVALID_USER_DATA
                message: "Los datos del usuario no son válidos"

        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

              example:
                status: error
                code: USER_NOT_FOUND
                message: "Usuario no encontrado"

        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

              example:
                status: error
                code: INTERNAL_SERVER_ERROR
                message: "Error interno del servidor"


# ==========================================
# COMPONENTS
# ==========================================

components:

  schemas:

    # ----------------------------------------
    # USER
    # ----------------------------------------

    User:
      type: object

      properties:

        _id:
          type: string
          description: Identificador único del usuario
          example: "64f1a2b3c4d5e6f789012345"

        name:
          type: string
          description: Nombre completo del usuario
          example: "Juan Pérez"

        email:
          type: string
          format: email
          description: Correo electrónico del usuario
          example: "juan.perez@example.com"

        password:
          type: string
          format: password
          description: Contraseña almacenada de forma hasheada
          example: "$2b$10$..."

        role:
          type: string
          description: Rol asignado al usuario
          enum:
            - admin
            - user
            - delivery
          default: user
          example: user

        phone:
          type: string
          description: Número telefónico del usuario
          example: "+54 351 5551234"

        address:
          type: string
          description: Dirección del usuario
          example: "Av. Colón 1234, Córdoba"

        createdAt:
          type: string
          format: date-time
          description: Fecha de creación del usuario
          example: "2026-08-31T22:30:00.000Z"

        updatedAt:
          type: string
          format: date-time
          description: Fecha de última actualización del usuario
          example: "2026-08-31T22:30:00.000Z"

      required:
        - name
        - email
        - password


    # ----------------------------------------
    # CREATE USER
    # ----------------------------------------

    CreateUser:
      type: object

      properties:

        name:
          type: string
          description: Nombre completo del usuario
          example: "Juan Pérez"

        email:
          type: string
          format: email
          description: Correo electrónico del usuario
          example: "juan.perez@example.com"

        password:
          type: string
          format: password
          description: Contraseña del usuario
          example: "coder123"

        role:
          type: string
          description: Rol del usuario
          enum:
            - admin
            - user
            - delivery
          default: user
          example: user

        phone:
          type: string
          description: Número telefónico del usuario
          example: "+54 351 5551234"

        address:
          type: string
          description: Dirección del usuario
          example: "Av. Colón 1234, Córdoba"

      required:
        - name
        - email
        - password