services:

  mongo:
    image: mongo:8
    container_name: shipnow-mongo
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: shipnow-api
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      NODE_ENV: production
      PORT: 8080
      MONGODB_URI: mongodb://mongo:27017/shipnow
      LOG_LEVEL: info

    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data: